#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: agent_data
      extra_toolchains: rust
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl"

  # Mapped column = raw field, checked with the duck_diff and finetype community
  # extensions. The sqllogictest suite above runs on every distribution
  # platform, where those community builds cannot be relied on, so this runs
  # the built linux_amd64 artifact with the DuckDB CLI instead.
  raw-mapping-coverage:
    name: Claude raw-to-column coverage
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent_data-v1.5.6-extension-linux_amd64
          path: artifact
      - name: DuckDB CLI v1.5.6
        run: |
          curl -sSL --fail -o duckdb_cli.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb_cli.zip -d cli
      - name: Mapped = raw (duck_diff), no unread field (finetype)
        run: |
          cli/duckdb -unsigned -bail \
            -cmd "LOAD '$PWD/artifact/agent_data.duckdb_extension'" \
            -f test/mapping/claude_raw_mapping.sql
